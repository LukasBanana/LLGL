<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>LLGL - LLGL_EXAMPLE_NAME</title>
    <link rel="stylesheet" href="../style.webapp.fullscreen.css">
    <link rel="stylesheet" href="submit.form.css">
    <script>
        // iOS Safari ignores user-scalable=no, so block its proprietary pinch gestures explicitly
        ["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
    </script>
</head>
<body>
    <!-- Create canvas that C++ code will draw into -->
    <div style="text-align: center;">
        <div class="canvas-container">
            <canvas id="canvas" oncontextmenu="event.preventDefault()" width="800" height="600"></canvas>
            <div class="watermark">Brought to you by LLGL</div>
        </div>
    </div>

    <!-- Form Overlay Markup (Hidden by default via CSS) -->
    <div id="emscripten-form-overlay" class="hidden">
        <div class="emscripten-modal">
            <button type="button" class="emscripten-close-x" id="es-close-btn" title="Cancel">&times;</button>
            <h3>Would you like to share your creation with the creator of the LLGL project to help improve it?</h3>
            <form id="es-user-form">
                <label for="es-name-input">Name:</label>
                <input type="text" id="es-name-input" placeholder="Name your creation..." required autocomplete="off">
                <div class="emscripten-modal-buttons">
                    <button type="button" class="emscripten-btn-cancel" id="es-cancel-btn">Cancel</button>
                    <button type="submit" class="emscripten-btn-submit">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Define module to allow C++ code to access the canvas element -->
    <script>
        var Module = {
            print: function() {
                var e = document.getElementById("output");
                return e && (e.value = ""), (...t) => {
                    var n = t.join(" ");
                    console.log(n), e && (e.value += n + "\n", e.scrollTop = e.scrollHeight)
                }
            }(),
            canvas: (() => {
                var e = document.getElementById("canvas");
                return e.addEventListener("webglcontextlost", (e => {
                    alert("WebGL context lost. You will need to reload the page."), e.preventDefault()
                }), !1), e
            })()
        };
    </script>

    <!-- Add JavaScript glue code generated by Emscripten -->
    <script src="Example_BrickPlay.data.js"></script>
    <script src="Example_BrickPlay.js"></script>
    <script src="submit.form.js"></script>
</body>
</html>
