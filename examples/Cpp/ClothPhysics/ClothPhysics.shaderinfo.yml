sources:
  - source: "Example.hlsl"
    entries:
      - entry: "VS"
        profile: "vs_5_0"
        targets: [glsl140core, glsl300es, spirv, metal]
      - entry: "PS"
        profile: "ps_5_0"
        targets: [glsl140core, glsl300es, spirv, metal]

      - entry: "CSForces"
        profile: "cs_5_0"
        targets: [glsl430core, glsl310es, spirv, metal]
      - entry: "CSStretchConstraints"
        optimize: 0 # Disable optimization for CSStretchConstraints to improve readability
        profile: "cs_5_0"
        targets: [glsl430core, glsl310es, spirv, metal]
      - entry: "CSRelaxation"
        profile: "cs_5_0"
        targets: [glsl430core, glsl310es, spirv, metal]

  - source: "Example.hlsl"
    permutation:
      override: "RWTextures"
      macros:
        ENABLE_STORAGE_TEXTURES: 1
    entries:
      - entry: "VS"
        profile: "vs_5_0"
        targets: [glsl140core, spirv, metal]

      - entry: "CSForces"
        profile: "cs_5_0"
        targets: [glsl430core, spirv, metal]
      - entry: "CSStretchConstraints"
        profile: "cs_5_0"
        targets: [glsl430core, spirv, metal]
      - entry: "CSRelaxation"
        profile: "cs_5_0"
        targets: [glsl430core, spirv, metal]

  - source: "ClothPhysics.StreamOutput.hlsl"
    entries:
      - entry: "VSForces"
        profile: "vs_5_0"
        targets: [glsl330core, spirv]
      - entry: "VSStretchConstraints"
        profile: "vs_5_0"
        targets: [glsl330core, spirv]
      - entry: "VSRelaxation"
        profile: "vs_5_0"
        targets: [glsl330core, spirv]

  - source: "ClothPhysics.StreamOutput.hlsl"
    permutation:
      macros:
        IS_TARGET_300ES: 1
    entries:
      - entry: "VSForces"
        profile: "vs_5_0"
        targets: [glsl300es]
      - entry: "VSStretchConstraints"
        profile: "vs_5_0"
        targets: [glsl300es]
      - entry: "VSRelaxation"
        profile: "vs_5_0"
        targets: [glsl300es]
