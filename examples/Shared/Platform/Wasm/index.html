<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>LLGL - LLGL_EXAMPLE_NAME</title>
    <link rel="stylesheet" href="../style.webapp.css">
    <script>
        // iOS Safari ignores user-scalable=no, so block its proprietary pinch gestures explicitly
        ["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
    </script>
</head>
<body>
    <!-- Create canvas that C++ code will draw into -->
    <div style="text-align: center;">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" width="800" height="600"></canvas>
    </div>

    <!-- Define module to allow C++ code to access the canvas element -->
    <script>
        var Module = {
            print: function() {
                var e = document.getElementById("output");
                return e && (e.value = ""), (...t) => {
                    var n = t.join(" ");
                    console.log(n), e && (e.value += n + "\n", e.scrollTop = e.scrollHeight)
                }
            }(),
            canvas: (() => {
                var e = document.getElementById("canvas");
                return e.addEventListener("webglcontextlost", (e => {
                    alert("WebGL context lost. You will need to reload the page."), e.preventDefault()
                }), !1), e
            })()
        };
    </script>

    <!-- Add JavaScript glue code generated by Emscripten -->
    <script src=LLGL_EXAMPLE_PROJECT.data.js></script>
    <script src=LLGL_EXAMPLE_PROJECT.js></script>
</body>
</html>
